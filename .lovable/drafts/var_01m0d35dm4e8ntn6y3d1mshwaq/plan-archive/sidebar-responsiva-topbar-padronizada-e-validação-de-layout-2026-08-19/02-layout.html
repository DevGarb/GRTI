<svg viewBox="0 0 640 300" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <style>
    .lbl { font-size: 14px; font-weight: 480; fill: hsl(var(--foreground)); }
    .sm  { font-size: 12px; fill: hsl(var(--muted-foreground)); }
    .tag { font-size: 12px; fill: hsl(var(--border)); }
    .bx  { fill: none; stroke: hsl(var(--muted-foreground)); stroke-width: 1; }
    .q   { fill: hsl(var(--muted)); }
    .g   { fill: hsl(var(--border)); }
    .acc { fill: hsl(var(--accent)); }
    .accs{ fill: none; stroke: hsl(var(--accent)); stroke-width: 1; }
  </style>

  <!-- desktop -->
  <text x="12" y="16" class="tag">desktop ≥ 1024px</text>
  <rect x="12" y="26" width="300" height="150" rx="8" class="bx"/>
  <rect x="12" y="26" width="70" height="150" rx="8" class="q"/>
  <rect x="12" y="26" width="70" height="150" rx="8" class="bx"/>
  <rect x="24" y="42" width="46" height="7" rx="3" class="g"/>
  <rect x="24" y="60" width="46" height="7" rx="3" class="g"/>
  <rect x="24" y="74" width="46" height="7" rx="3" class="g"/>
  <rect x="82" y="26" width="230" height="26" class="bx"/>
  <text x="92" y="43" class="sm">topbar (vidro)</text>
  <rect x="94" y="66" width="120" height="9" rx="4" class="acc"/>
  <rect x="94" y="82" width="80" height="6" rx="3" class="g"/>
  <rect x="94" y="102" width="200" height="60" rx="8" class="bx"/>
  <text x="24" y="196" class="lbl">240px ⟷ 72px mini-rail</text>
  <text x="24" y="214" class="sm">preferência salva em localStorage</text>

  <!-- mobile -->
  <text x="368" y="16" class="tag">mobile &lt; 1024px</text>
  <rect x="368" y="26" width="120" height="150" rx="8" class="bx"/>
  <rect x="368" y="26" width="120" height="26" class="bx"/>
  <rect x="378" y="35" width="10" height="8" rx="2" class="acc"/>
  <text x="396" y="43" class="sm">menu</text>
  <rect x="380" y="66" width="80" height="9" rx="4" class="g"/>
  <rect x="380" y="90" width="96" height="70" rx="8" class="bx"/>

  <!-- gaveta aberta -->
  <rect x="510" y="26" width="120" height="150" rx="8" class="bx"/>
  <rect x="510" y="26" width="76" height="150" rx="8" class="q"/>
  <rect x="510" y="26" width="76" height="150" rx="8" class="accs"/>
  <rect x="522" y="44" width="52" height="7" rx="3" class="g"/>
  <rect x="522" y="60" width="52" height="7" rx="3" class="g"/>
  <rect x="522" y="76" width="52" height="7" rx="3" class="g"/>
  <text x="368" y="196" class="lbl">gaveta + overlay</text>
  <text x="368" y="214" class="sm">fecha com Esc, clique fora ou ao navegar</text>

  <!-- ledger -->
  <circle cx="20" cy="248" r="9" class="acc"/>
  <text x="20" y="252" text-anchor="middle" style="font-size:11px" fill="hsl(var(--accent-foreground))">1</text>
  <text x="38" y="252" class="sm">título de página com gradiente e sobretítulo mono — mesmos estilos do login</text>
  <circle cx="20" cy="276" r="9" class="acc"/>
  <text x="20" y="280" text-anchor="middle" style="font-size:11px" fill="hsl(var(--accent-foreground))">2</text>
  <text x="38" y="280" class="sm">validações automáticas cobrem os dois tamanhos de tela</text>
</svg>
